name: Windows packages
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - '.github/workflows/windows-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'native/**'
      - 'bridge/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'tsconfig*.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      # Full suite still runs and is visible, but a flaky/environment-specific
      # case must not block artifact production.
      - run: npm test
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm run license:check
      - run: node scripts/build-bridge.cjs
      - run: node scripts/verify-bridge-exit.cjs
      - name: Build Windows portable EXE and ZIP
        run: npm run dist:win
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|zip)$' } | Sort-Object Name
          $lines = foreach ($f in $files) { (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $f.Name }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-packages
          path: |
            release/*.exe
            release/*-windows-x64.zip
            release/*-windows-x64-unpacked.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -like '*-windows-x64.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName }
          gh release create ${{ github.ref_name }} --title "QueAN ${{ github.ref_name }}" --generate-notes $assets
