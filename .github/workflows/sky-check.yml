name: Sky Compile Check
on:
  push:
    branches: ['tmp/sky-check']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.6.0'
      - name: Compile
        id: build
        continue-on-error: true
        working-directory: sky
        run: gradle :app:compileReleaseKotlin --no-daemon --stacktrace > /tmp/sky.log 2>&1 || (tail -c 20000 /tmp/sky.log; exit 1)
      - name: Report log
        if: always()
        run: |
          mkdir -p ci-reports
          cp /tmp/sky.log ci-reports/sky.log 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci@quaan.local"
          git add -f ci-reports/sky.log
          git commit -m "ci: sky compile log (${{ steps.build.outcome }})" || true
          git push origin HEAD:ci-sky --force
