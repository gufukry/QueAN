name: QueAN Compose APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'quaan_compose/**'
      - '.github/workflows/compose-loader.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.6.0'

      - name: Prepare signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/quean.keystore" \
            -alias quean -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass quean123456 -keypass quean123456 \
            -dname "CN=QueAN, OU=Loader, O=QueAN, L=CN, C=CN" > /dev/null
          echo "KEYSTORE_PATH=$RUNNER_TEMP/quean.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=quean123456" >> $GITHUB_ENV
          echo "KEY_ALIAS=quean" >> $GITHUB_ENV
          echo "KEY_PASSWORD=quean123456" >> $GITHUB_ENV

      - name: Build release APK
        id: build
        continue-on-error: true
        working-directory: quaan_compose
        run: gradle :app:assembleRelease --no-daemon --stacktrace > /tmp/build.log 2>&1 || (tail -c 20000 /tmp/build.log; exit 1)

      - name: Report build log
        if: always()
        run: |
          mkdir -p ci-reports
          cp /tmp/build.log ci-reports/build.log 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci@quaan.local"
          git add -f ci-reports/build.log
          git commit -m "ci: build log (${{ steps.build.outcome }})" || true
          git push origin HEAD:ci-log --force

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: QueAN-Compose-release
          path: quaan_compose/app/build/outputs/apk/release/*.apk

      - name: Publish APK to branch
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p out
          cp quaan_compose/app/build/outputs/apk/release/*.apk out/quean-release.apk
          printf 'version=2.0\nbuild=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/info.txt
          git checkout --orphan apk-tmp || true
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f out/quean-release.apk out/info.txt
          git config user.name "ci-bot"
          git config user.email "ci@quaan.local"
          git commit -m "apk: build from ${GITHUB_SHA:0:7}"
          git push origin HEAD:apk --force
